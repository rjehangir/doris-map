name: doris-tracker
services:
  - name: api
    github:
      repo: <your-github-org>/SolarSurfer2-cloud
      branch: doris-tracker
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_size_slug: basic-xxs
    instance_count: 1
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: PORT
        scope: RUN_TIME
        value: "8000"
      - key: RESEND_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: EMAIL_FROM
        scope: RUN_TIME
        value: "DORIS Tracker <notifications@example.com>"
      - key: APP_BASE_URL
        scope: RUN_TIME
        value: "https://doris-tracker.ondigitalocean.app"
      # Static map image for notification emails (optional).
      # Set MAPBOX_TOKEN or MAPTILER_KEY; if neither is set, emails omit
      # the map image (all other content still renders normally).
      - key: MAPBOX_TOKEN
        scope: RUN_TIME
        type: SECRET
      # Shared secret verified on every /rockblock-webhook post. Accepted
      # either as `?secret=<value>` on the URL (what Ground Control's portal
      # supports) or as `Authorization: Bearer <value>`. If unset, the
      # endpoint returns 503 for every request (fail-closed).
      - key: WEBHOOK_SHARED_SECRET
        scope: RUN_TIME
        type: SECRET
      # Ground Control's published egress IPs for webhook delivery
      # (https://docs.groundcontrol.com/iot/rockblock/web-services/integration).
      # Requests from any other IP are rejected with 403.
      - key: ROCKBLOCK_ALLOWED_IPS
        scope: RUN_TIME
        value: "109.74.196.135,212.71.235.32"
      # Optional. PEM-encoded RSA public key used to verify a `JWT` field
      # when Ground Control includes one (HTTP_JSON). Form HTTP_POST does
      # not send JWT; those posts still authenticate via shared secret.
      # Key published at
      # https://docs.groundcontrol.com/iot/rockblock/web-services/receiving-mo-message
      - key: ROCKBLOCK_JWT_PUBLIC_KEY
        scope: RUN_TIME
        type: SECRET
    routes:
      - path: /
